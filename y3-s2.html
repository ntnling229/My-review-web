<!DOCTYPE html>

<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">

        <div class="flex items-center justify-between">

            <a href="index.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium transition">

        </div>

        <!-- 科目卡片網格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 第一個科目預留位 (例如日後要加的科目) -->
            <!--<a href="GEST1006.html" class="block bg-slate-900 p-6 rounded-2xl border border-slate-800 hover:border-blue-500 transition shadow-lg space-y-3 group">-->
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 hover:border-emerald-500 transition shadow-lg space-y-3 group">
                    <div class="flex items-center justify-between">

                        <i class="fa-solid fa-book text-xl"></i>
                    </span>
