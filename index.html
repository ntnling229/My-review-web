<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大學複習中心 📚</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-4xl w-full mx-auto space-y-8 py-12">
        <div class="text-center space-y-3">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">大學期中/期末複習中心 📚</h1>
            <p class="text-slate-400 text-sm md:text-base">選擇對應的學年與學期，進入各科目的獨立溫習指南。</p>
        </div>

        <!-- 學年選擇網格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Year 1 (大一) -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="p-3 bg-slate-800 text-slate-300 rounded-xl">
                        <i class="fa-solid fa-graduation-cap text-xl"></i>
                    </span>
                    <span class="text-xs font-mono bg-slate-800 px-2.5 py-1 rounded text-slate-400">Year 1</span>
                </div>
                <h3 class="text-xl font-bold text-white">Year 1 (大一學年)</h3>
                <p class="text-sm text-slate-400">大一基礎核心科目複習指南。</p>
                <div class="pt-2 flex gap-3">
                    <span class="flex-1 text-center py-2 bg-slate-800/50 text-slate-500 rounded-lg text-sm">上學期 (準備中)</span>
                    <span class="flex-1 text-center py-2 bg-slate-800/50 text-slate-500 rounded-lg text-sm">下學期 (準備中)</span>
                </div>
            </div>

            <!-- Year 2 (大二) - 當前學年 -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-blue-500/50 shadow-lg shadow-blue-900/20 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="p-3 bg-blue-600/20 text-blue-400 rounded-xl">
                        <i class="fa-solid fa-user-graduate text-xl"></i>
                    </span>
                    <span class="text-xs font-mono bg-blue-950 text-blue-400 border border-blue-800 px-2.5 py-1 rounded">Current</span>
                </div>
                <h3 class="text-xl font-bold text-white">Year 2 (大二學年)</h3>
                <p class="text-sm text-slate-400">選擇當前學期的專業科目溫習網頁。</p>
                
                <!-- 學期與科目清單 -->
                <div class="space-y-3 pt-2">
                    <!-- 上學期 Sem 1 -->
                    <div class="space-y-2">
                        <span class="text-xs font-bold text-blue-400 uppercase tracking-wider block">上學期 (Semester 1)</span>
                        
                        <!-- GEST1006 連結 -->
                        <a href="GEST1006.html" class="block p-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl transition border border-slate-700 hover:border-blue-500 group">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-3">
                                    <i class="fa-solid fa-brain text-blue-400"></i>
                                    <div>
                                        <div class="text-xs text-slate-400 font-mono">GEST1006</div>
                                        <div class="text-sm font-bold group-hover:text-blue-400 transition">Logic and Reasoning for Business</div>
                                    </div>
                                </div>
                                <i class="fa-solid fa-arrow-right text-xs text-slate-500 group-hover:text-blue-400"></i>
                            </div>
                        </a>
                    </div>

                    <!-- 下學期 Sem 2 (預留) -->
                    <div class="space-y-2 pt-1">
                        <span class="text-xs font-bold text-slate-500 uppercase tracking-wider block">下學期 (Semester 2)</span>
                        <div class="p-3 bg-slate-800/40 rounded-xl border border-slate-800 text-slate-500 text-sm italic">
                            下學期科目準備中...
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
