<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大學複習中心 📚</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-4xl w-full mx-auto space-y-8 py-12">
        <div class="text-center space-y-3">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white">大學期中/期末複習中心 📚</h1>
            <p class="text-slate-400 text-sm md:text-base">請選擇你的修讀學年 (Year 1 - Year 4)，進入對應的學期與科目指南。</p>
        </div>

        <!-- 四個 Year 的格仔網格 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Year 1 -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="p-3 bg-slate-800 text-slate-300 rounded-xl">
                        <i class="fa-solid fa-1 text-xl"></i>
                    </span>
                    <span class="text-xs font-mono bg-slate-800 px-2.5 py-1 rounded text-slate-400">Year 1</span>
                </div>
                <h3 class="text-xl font-bold text-white">Year 1 (大一學年)</h3>
                <div class="pt-2 flex gap-3">
                    <a href="y1-s1.html" class="flex-1 text-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-semibold transition">上學期</a>
                    <a href="y1-s2.html" class="flex-1 text-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-semibold transition">下學期</a>
                </div>
            </div>

            <!-- Year 2 (當前學年) -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-blue-500/50 shadow-lg shadow-blue-900/20 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="p-3 bg-blue-600/20 text-blue-400 rounded-xl">
                        <i class="fa-solid fa-2 text-xl"></i>
                    </span>
                    <span class="text-xs font-mono bg-blue-950 text-blue-400 border border-blue-800 px-2.5 py-1 rounded">Current</span>
                </div>
                <h3 class="text-xl font-bold text-white">Year 2 (大二學年)</h3>
                <div class="pt-2 flex gap-3">
                    <a href="y2-s1.html" class="flex-1 text-center py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition shadow-sm">上學期</a>
                    <a href="y2-s2.html" class="flex-1 text-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-semibold transition">下學期</a>
                </div>
            </div>

            <!-- Year 3 -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="p-3 bg-slate-800 text-slate-300 rounded-xl">
                        <i class="fa-solid fa-3 text-xl"></i>
                    </span>
                    <span class="text-xs font-mono bg-slate-800 px-2.5 py-1 rounded text-slate-400">Year 3</span>
                </div>
                <h3 class="text-xl font-bold text-white">Year 3 (大三學年)</h3>
                <div class="pt-2 flex gap-3">
                    <a href="y3-s1.html" class="flex-1 text-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-semibold transition">上學期</a>
                    <a href="y3-s2.html" class="flex-1 text-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-semibold transition">下學期</a>
                </div>
            </div>

            <!-- Year 4 -->
            <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
                <div class="flex items-center justify-between">
                    <span class="p-3 bg-slate-800 text-slate-300 rounded-xl">
                        <i class="fa-solid fa-4 text-xl"></i>
                    </span>
                    <span class="text-xs font-mono bg-slate-800 px-2.5 py-1 rounded text-slate-400">Year 4</span>
                </div>
                <h3 class="text-xl font-bold text-white">Year 4 (大四學年)</h3>
                <div class="pt-2 flex gap-3">
                    <a href="y4-s1.html" class="flex-1 text-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-semibold transition">上學期</a>
                    <a href="y4-s2.html" class="flex-1 text-center py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-sm font-semibold transition">下學期</a>
                </div>
            </div>

        </div>
    </div>
</body>
</html>
